<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Country Search" />
    <title>Country Search</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>COUNTRY SEARCH</h1>
      </header>

      <section class="search-panel" aria-label="Search by country">
        <label class="search-label" for="search-input">Name of country</label>
        <div class="search-row">
          <input
            id="search-input"
            type="search"
            placeholder="Например, Spain..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clear-button" class="secondary-button" type="button">Clear</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="error-panel" class="error-panel" hidden>
          <span id="error-message"></span>
          <button id="retry-button" class="retry-button" type="button">Repeat</button>
        </div>
      </section>

      <section id="history-section" class="history-section" hidden>
        <h2>Recent queries</h2>
        <div id="history-list" class="history-list"></div>
      </section>

      <section class="results-section">
        <div id="results" class="country-grid"></div>
        <p id="empty-state" class="empty-state" hidden>No countries found for your query.</p>
      </section>

      <dialog id="country-dialog" class="country-dialog">
        <button id="close-dialog" class="dialog-close" type="button" aria-label="Close">Х</button>
        <div id="country-details"></div>
      </dialog>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
